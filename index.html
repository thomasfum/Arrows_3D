		THREE.VolumetericLightShader = {
  uniforms: {
    tDiffuse: {value:null},
   // lightPosition: {value: new THREE.Vector2(0.5, 0.5)},
    lightPosition: {value: new THREE.Vector2(0.5, 0.5)},
    exposure: {value: 0.18},
    decay: {value: 0.95},
    density: {value: 0.8},
    weight: {value: 0.4},
    samples: {value: 100}
  },

  vertexShader: [
    "varying vec2 vUv;",
    "void main() {",
      "vUv = uv;",
      "gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );",
    "}"
  ].join("\n"),

  fragmentShader: [
    "varying vec2 vUv;",
    "uniform sampler2D tDiffuse;",
    "uniform vec2 lightPosition;",
    "uniform float exposure;",
    "uniform float decay;",
    "uniform float density;",
    "uniform float weight;",
    "uniform int samples;",
    "const int MAX_SAMPLES = 100;",
    "void main()",
    "{",
      "vec2 texCoord = vUv;",
      "vec2 deltaTextCoord = texCoord - lightPosition;",
      "deltaTextCoord *= 1.0 / float(samples) * density;",
      "vec4 color = texture2D(tDiffuse, texCoord);",
      "float illuminationDecay = 1.0;",
      "for(int i=0; i < MAX_SAMPLES; i++)",
      "{",
        "if(i == samples){",
          "break;",
        "}",
        "texCoord -= deltaTextCoord;",
        "vec4 sample = texture2D(tDiffuse, texCoord);",
        "sample *= illuminationDecay * weight;",
        "color += sample;",
        "illuminationDecay *= decay;",
      "}",
      "gl_FragColor = color * exposure;",
    "}"
  ].join("\n")
};

THREE.AdditiveBlendingShader = {
  uniforms: {
    tDiffuse: { value:null },
    tAdd: { value:null }
  },

  vertexShader: [
    "varying vec2 vUv;",
    "void main() {",
      "vUv = uv;",
      "gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );",
    "}"
  ].join("\n"),

  fragmentShader: [
    "uniform sampler2D tDiffuse;",
    "uniform sampler2D tAdd;",
    "varying vec2 vUv;",
    "void main() {",
      "vec4 color = texture2D( tDiffuse, vUv );",
      "vec4 add = texture2D( tAdd, vUv );",
      "gl_FragColor = color + add;",
    "}"
  ].join("\n")
};

THREE.PassThroughShader = {
	uniforms: {
		tDiffuse: { value: null }
	},

	vertexShader: [
		"varying vec2 vUv;",
    "void main() {",
		  "vUv = uv;",
			"gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );",
		"}"
	].join( "\n" ),

	fragmentShader: [
    "uniform sampler2D tDiffuse;",
    "varying vec2 vUv;",
    "void main() {",
			"gl_FragColor = texture2D( tDiffuse, vec2( vUv.x, vUv.y ) );",
		"}"
	].join( "\n" )
};

//--------------------------------------------------------------------------------------
//---   setupPostprocessing
//--------------------------------------------------------------------------------------
    function setupPostprocessing(){
		var pass;
		var effectFXAA;
		occlusionRenderTarget = new THREE.WebGLRenderTarget(container.clientWidth * renderScale, container.clientHeight * renderScale );
		occlusionComposer = new THREE.EffectComposer( renderer, occlusionRenderTarget);
		occlusionComposer.addPass( new THREE.RenderPass( scene, camera ) );
		pass = new THREE.ShaderPass( THREE.VolumetericLightShader );
		pass.needsSwap = false;
		occlusionComposer.addPass( pass );
		
		volumetericLightShaderUniforms = pass.uniforms;


		
		composer = new THREE.EffectComposer( renderer );
		composer.addPass( new THREE.RenderPass( scene, camera ) );
		pass = new THREE.ShaderPass( THREE.AdditiveBlendingShader );
		pass.uniforms.tAdd.value = occlusionRenderTarget.texture;
		composer.addPass( pass );
		//pass.renderToScreen = true;
		

		var Width = container.clientWidth;
		var Height = container.clientHeight;
			
		effectFXAA =  new THREE.ShaderPass(THREE.FXAAShader);
		effectFXAA.uniforms[ 'resolution' ].value.set( 1 / Width, 1 / Height );
		effectFXAA.renderToScreen = true;
		composer.addPass(effectFXAA);
  }

	THREE.Object3D.prototype.rotateAroundWorldAxis = function() {

		var q1 = new THREE.Quaternion();
		return function ( point, axis, angle ) {

			q1.setFromAxisAngle( axis, angle );

			this.quaternion.multiplyQuaternions( q1, this.quaternion );

			this.position.sub( point );
			this.position.applyQuaternion( q1 );
			this.position.add( point );

			return this;
		}

	}();

				newWidth  = Math.floor( container.clientWidth / pixelRatio ) || 1,
				newHeight = Math.floor( container.clientHeight / pixelRatio ) || 1;

		
				
			}

			function render() {
				//var delta = clock.getDelta();
				//if ( elf !== undefined ) {
					//elf.rotation.z += delta * 0.5;
				//	}
				
				controls.update(); // only required if controls.enableDamping = true, or if controls.autoRotate = true
						
				UpdateClock();
				
				if(butonAction==true)
				{
					if(butonDown==true)
					{
						butonPos++;
						Button.translateY( -0.01 );
						if(butonPos>3)
							butonDown=false;
					}
					else
					{
						butonPos--;
						if(butonPos==0)
							butonAction=false;
						Button.translateY( 0.01 );
					}	
				}
								
						if(rotateLight==true)
						{
				
							var xAxis = new THREE.Vector3(0,1,0);
							//rectLight[0].rotateOnAxis( xAxis,0.1);
							for (var i = 0; i < sides; i++) {
								rectLight01[i].rotateAroundWorldAxis(rotateLightAngleCenter, xAxis, -0.02);
						//	rectLight02[i].rotateAroundWorldAxis(rotateLightAngleCenter, xAxis, 0.1);
					//		rectLight03[i].rotateAroundWorldAxis(rotateLightAngleCenter, xAxis, 0.1);
							}
							
							TextureElephant1.offset.x = TextureElephant1.offset.x+0.002;
							TextureElephant2.offset.x = TextureElephant2.offset.x+0.002;
							TextureElephant3.offset.x = TextureElephant3.offset.x+0.002;
							TextureElephant4.offset.x = TextureElephant4.offset.x+0.002;
							TextureElephant5.offset.x = TextureElephant5.offset.x+0.002;
						}
						
							raycaster.setFromCamera( mouse, camera ); 
				
				// calculate objects intersecting the picking ray 
				var intersects =  raycaster.intersectObjects( scene.children,true ); 
			  
				/*
				for ( var i = 0; i < intersects.length; i++ ) { 
					//intersects[ i ].object.material.color.set( 0xff0000 ); 
					console.log('--->' + intersects[ i ].object.name);
				}
				*/		  
				if(intersects.length>0)
				{
					//console.log('--->' + intersects[ 0 ].object.name);
					lastElementMouseOver=intersects[ 0 ].object.name;
					
				}
				else
					txt.style.display = "none";
					
		
		
			//	renderer.render( scene, camera );
			
			
			if(renderType==1)
			{
				if(lightOn==true)
					scene.background = new THREE.Color( backgroundColor ); 
				else
					scene.background = new THREE.Color( 0x000000 );
				renderer.render( scene, camera );
			}	
			else
			{
				
					//volumetericLightShaderUniforms.lightPosition.value.set(2, -4);
					
				var p = lightSphere.position.clone(),
					  vector = p.project(camera),
					  x = ( vector.x + 1 ) / 2,
					  y = ( vector.y + 1 ) / 2;
				  volumetericLightShaderUniforms.lightPosition.value.set(x, y);
				  //console.log("tttttttt="+volumetericLightShaderUniforms.exposure.value);
					  
					  
				if(rotateLight==true)
				  volumetericLightShaderUniforms.exposure.value=0.2;//0.18
				 else
					volumetericLightShaderUniforms.exposure.value=0;
				  
				  
			
				   camera.layers.set(OCCLUSION_LAYER);
					scene.background = new THREE.Color( 0x000000 ); 
						
					//renderer.setClearColor(0x000000);
					
					occlusionComposer.render();

				   camera.layers.set(DEFAULT_LAYER);
					//renderer.setClearColor(0x090611);
					if(lightOn==true)
						scene.background = new THREE.Color( backgroundColor ); 
						
					composer.render();
					}

		}
		
		function onMouseDown( event ) { 
				if((lastElementMouseOver=="node0")||(lastElementMouseOver==""))
					lastElementMouseOver="clock";
				 txt.textContent = lastElementMouseOver + " clicked";
				 txt.style.display = "block";
				 if(lastElementMouseOver=="Buton")
				 {
					butonPos=0;
					butonAction=true;
					butonDown=true;
					console.log('Button clicked');
				 }
				 
				 if(lastElementMouseOver=="Table")

					console.log('=====>show');
					document.getElementById('p1').style.display = "inline";
					document.getElementById('p2').style.display = "inline";
					document.getElementById('myRangeX').style.display = "inline";
					document.getElementById('myRangeY').style.display = "inline";
				}
				else
				{

					document.getElementById('p2').style.display = "none";
					document.getElementById('myRangeX').style.display = "none";
					document.getElementById('myRangeY').style.display = "none";
				}
			 
			} 
			container.addEventListener( 'mousedown', onMouseDown, false );

	function onMouseMove( event ) { 
			  // calculate mouse position in normalized device coordinates 
			  // (-1 to +1) for both components 
			  mouse.x =  ( event.clientX / window.innerWidth ) * 2 - 1; 
			  mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1; 
			} 

		container.addEventListener( 'mousemove', onMouseMove, false );
